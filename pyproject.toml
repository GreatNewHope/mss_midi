[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "choir-separator-project"
version = "0.1.0"
requires-python = ">=3.10, <3.13"
dependencies = []

[dependency-groups]
core = [
	# Dependencies used directly by this repository's scripts.
	"huggingface-hub",
	"melband-roformer-infer",
	"PyYAML",
	"soundfile",
	"torch",
	"torchaudio",
]
choir-parts = [
	# Required only by choir_parts_separation.py.
	"asteroid",
]
mss-runtime = [
	# Music-Source-Separation-Training inference-time imports used by the Mega53
	# bs_roformer pipeline in this repository. Keep this lean: no training-only,
	# GUI, or optional CUDA-kernel dependencies.
	"ml_collections",
	"omegaconf==2.2.3",
	"numpy",
	"scipy",
	"librosa",
	"soundfile",
	"matplotlib",
	"packaging",
	"tqdm",
	"beartype==0.14.1",
	"einops==0.8.1",
	"rotary_embedding_torch==0.3.5",
]
polyphonic-choir-midi = [
	# Required only by audio_to_midi.py (the unseparated-choir fallback).
	"basic-pitch",
]
unmixx-runtime = [
	# UNMIXX inference-time third-party imports from the model entrypoint
	# (look2hear.models -> UNMIXX and transitive layer/utils modules).
	"numpy",
	"packaging",
	"librosa",
	"torch-complex",
	"typeguard",
	"rich",
	"matplotlib",
	"pandas",
	"praat-parselmouth",
	"rich",
]
dev = [
	"ipykernel>=7.3.0",
	"anywidget",
]
alignment-review = [
	"anywidget>=0.11",
]

[tool.setuptools]
py-modules = []

[tool.uv]
package = false
default-groups = ["core", "dev"]
index-url = "https://pypi.org/simple"
extra-index-url = []
index-strategy = "first-index"
